<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계관 아카이브</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <canvas id="bg-canvas"></canvas>

  <div class="intro-overlay" id="introOverlay">
    <div class="intro-modal">
      <button class="intro-skip" id="introSkip">건너뛰기</button>

      <div class="intro-slides" id="introSlides">
        <div class="intro-slide is-active" data-step="0">
          <div class="intro-eyebrow">WORLD ARCHIVE</div>
          <h2>세계관 아카이브에 오신 것을 환영합니다</h2>
          <p>플레이한 서브컬쳐 게임들의 세계관을, 오래된 기록 보관소의 파일을 열람하듯 정리해두었습니다.</p>
        </div>
        <div class="intro-slide" data-step="1">
          <div class="intro-eyebrow">HOW TO USE</div>
          <h2>파일을 열람하세요</h2>
          <p>카드를 클릭하면 각 게임의 세계관, 타임라인, 주요 세력, 캐릭터, 용어집을 순서대로 확인할 수 있습니다.</p>
        </div>
        <div class="intro-slide" data-step="2">
          <div class="intro-eyebrow">READY</div>
          <h2>입장할 준비가 되셨나요</h2>
          <p>아카이브의 문이 열립니다.</p>
        </div>
      </div>

      <div class="intro-footer">
        <div class="intro-dots" id="introDots"></div>
        <div class="intro-actions">
          <button class="intro-btn ghost" id="introPrev">이전</button>
          <button class="intro-btn primary" id="introNext">다음</button>
        </div>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="eyebrow">WORLD ARCHIVE</div>
    <h1>세계관 아카이브</h1>
    <div class="sub">플레이한 서브컬쳐 게임들의 세계관을 파일로 정리했습니다.</div>
  </header>

  <main class="archive-grid" id="archiveGrid"></main>

  <script src="data.js"></script>
  <script src="effects.js"></script>
  <script src="intro.js"></script>
  <script>
    const grid = document.getElementById('archiveGrid');

    if (!gamesData || gamesData.length === 0) {
      grid.innerHTML = '<div class="empty-state">아직 등록된 파일이 없습니다. data.js에 게임을 추가해보세요.</div>';
    } else {
      gamesData.forEach((game, index) => {
        const tilt = (index % 2 === 0 ? -1 : 1) * (1 + (index % 3));
        const card = document.createElement('a');
        card.href = `detail.html?id=${encodeURIComponent(game.id)}`;
        card.className = 'file-card';
        card.style.setProperty('--tilt', `${tilt}deg`);

        card.innerHTML = `
          <div class="card-inner" style="--accent:${game.accentColor || ''}">
            <div class="file-number">FILE NO. ${game.fileNumber || String(index + 1).padStart(3, '0')}</div>
            <h2>${game.title}</h2>
            <span class="genre-tag">${game.genre || ''}</span>
            <p class="hook">${game.hook || ''}</p>
            <span class="open-link">파일 열람 →</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>

</body>
</html>
