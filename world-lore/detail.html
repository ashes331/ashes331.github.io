<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계관 파일</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <canvas id="bg-canvas"></canvas>

  <div class="detail-shell" id="shell">
    <a href="index.html" class="back-link">← 아카이브로 돌아가기</a>
  </div>

  <script src="data.js"></script>
  <script src="effects.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const game = gamesData.find(g => g.id === id);
    const shell = document.getElementById('shell');

    if (!game) {
      shell.innerHTML += '<div class="empty-state" style="grid-column:1/-1;">해당 파일을 찾을 수 없습니다. <a href="index.html" style="color:#b08d57;">목록으로 돌아가기</a></div>';
    } else {
      document.title = `${game.title} · 세계관 파일`;

      // 섹션 정의: key, 라벨, 데이터 존재 여부
      const sections = [
        { key: 'worldview', label: '세계관', has: game.worldview && game.worldview.length },
        { key: 'timeline', label: '타임라인', has: game.timeline && game.timeline.length },
        { key: 'factions', label: '주요 세력', has: game.factions && game.factions.length },
        { key: 'characters', label: '주요 캐릭터', has: game.characters && game.characters.length },
        { key: 'glossary', label: '용어집', has: game.glossary && game.glossary.length }
      ].filter(s => s.has);

      // 탭 네비게이션
      const tabNav = document.createElement('nav');
      tabNav.className = 'tab-nav';
      tabNav.innerHTML = sections.map((s, i) =>
        `<button data-target="${s.key}" class="${i === 0 ? 'active' : ''}">${s.label}</button>`
      ).join('');
      shell.appendChild(tabNav);

      // 메인 콘텐츠
      const main = document.createElement('main');
      main.className = 'detail-main';

      main.innerHTML += `
        <div class="file-header" style="--accent:${game.accentColor || ''}">
          <div class="file-number">FILE NO. ${game.fileNumber || ''}</div>
          <h1>${game.title}</h1>
          <span class="genre-tag">${game.genre || ''}</span>
        </div>
      `;

      if (game.worldview && game.worldview.length) {
        main.innerHTML += `
          <section class="lore-section" id="worldview">
            <h2>세계관</h2>
            ${game.worldview.map(p => `<p>${p}</p>`).join('')}
          </section>
        `;
      }

      if (game.timeline && game.timeline.length) {
        main.innerHTML += `
          <section class="lore-section" id="timeline">
            <h2>타임라인</h2>
            <div class="timeline">
              ${game.timeline.map(t => `
                <div class="timeline-item">
                  <span class="era">${t.era}</span>
                  <span class="event">${t.event}</span>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }

      if (game.factions && game.factions.length) {
        main.innerHTML += `
          <section class="lore-section" id="factions">
            <h2>주요 세력</h2>
            <div class="entity-grid">
              ${game.factions.map(f => `
                <div class="entity-card">
                  <h3>${f.name}</h3>
                  <p>${f.description}</p>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }

      if (game.characters && game.characters.length) {
        main.innerHTML += `
          <section class="lore-section" id="characters">
            <h2>주요 캐릭터</h2>
            <div class="entity-grid">
              ${game.characters.map(c => `
                <div class="entity-card">
                  <h3>${c.name}</h3>
                  <span class="role">${c.role || ''}</span>
                  <p>${c.description}</p>
                </div>
              `).join('')}
            </div>
          </section>
        `;
      }

      if (game.glossary && game.glossary.length) {
        main.innerHTML += `
          <section class="lore-section" id="glossary">
            <h2>용어집</h2>
            <dl class="glossary-list">
              ${game.glossary.map(g => `
                <dt>${g.term}</dt>
                <dd>${g.description}</dd>
              `).join('')}
            </dl>
          </section>
        `;
      }

      shell.appendChild(main);

      // 탭 클릭 시 스크롤 + active 상태 전환
      const buttons = tabNav.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById(btn.dataset.target).scrollIntoView({ behavior: 'smooth' });
        });
      });

      // 스크롤 위치에 따라 active 탭 자동 갱신
      const sectionEls = sections.map(s => document.getElementById(s.key));
      window.addEventListener('scroll', () => {
        let current = sectionEls[0];
        sectionEls.forEach(el => {
          if (el.getBoundingClientRect().top <= 120) current = el;
        });
        buttons.forEach(b => b.classList.toggle('active', b.dataset.target === current.id));
      });
    }
  </script>

</body>
</html>
